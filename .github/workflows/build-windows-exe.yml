name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest
      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --windowed --name QRPrintShop
          --add-data "static;static" --hidden-import win32timezone --collect-submodules uvicorn run.py
      - uses: actions/upload-artifact@v4
        with:
          name: QRPrintShop-Windows
          path: dist/QRPrintShop.exe
