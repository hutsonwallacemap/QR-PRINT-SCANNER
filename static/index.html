<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Scan &amp; Print — Upload Files</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 18px;
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .printer-pill {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #93c5fd;
      font-size: 0.8rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .dropzone {
      border: 2px dashed #475569;
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .dropzone.dragover {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.08);
    }
    .dropzone input { display: none; }
    .dropzone .icon { font-size: 2rem; margin-bottom: 6px; }
    .dropzone .hint { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .file-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.88rem;
    }
    .file-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 75%;
    }
    .file-item button {
      background: none;
      border: none;
      color: var(--danger);
      font-weight: 600;
      cursor: pointer;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
    }
    .seg-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .seg-btn {
      padding: 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--muted);
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .seg-btn.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--primary);
      color: #fff;
    }
    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .copies-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .copies-box button {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .copies-box input { text-align: center; }
    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    .submit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .status-card { display: none; }
    .job-status {
      padding: 12px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid var(--border);
      margin-top: 8px;
    }
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge.queued, .badge.printing { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    .badge.printed { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    .badge.failed { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .badge.waiting_approval { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .error-msg {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      display: none;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🖨️ Scan &amp; Print</h1>
      <p>Upload photos or PDFs — prints automatically on the shop printer</p>
      <div class="printer-pill" id="printerInfo">Connecting to printer...</div>
    </header>

    <div class="error-msg" id="errorBox"></div>

    <form id="printForm" class="card">
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.bmp,.gif,.webp,.tiff,.tif,.pdf,.txt,.csv,.md" />
        <div class="icon">📄📸</div>
        <div><strong>Tap to choose images or PDFs</strong></div>
        <div class="hint">Supports JPG, PNG, PDF, TXT (multiple files allowed)</div>
      </div>
      <div class="file-list" id="fileList"></div>

      <div class="field" style="margin-top: 16px;">
        <label>Color Mode</label>
        <div class="seg-group">
          <button type="button" class="seg-btn active" data-color="color">🎨 Color</button>
          <button type="button" class="seg-btn" data-color="bw">⬛ Black &amp; White</button>
        </div>
      </div>

      <div class="field">
        <label for="pageRange">Pages (e.g. <code>all</code> or <code>1-3, 5</code>)</label>
        <input type="text" id="pageRange" value="all" placeholder="all" />
      </div>

      <div class="row2">
        <div class="field">
          <label>Copies</label>
          <div class="copies-box">
            <button type="button" id="decCopies">−</button>
            <input type="number" id="copies" value="1" min="1" max="99" />
            <button type="button" id="incCopies">+</button>
          </div>
        </div>
        <div class="field">
          <label for="orientation">Orientation</label>
          <select id="orientation">
            <option value="auto">Auto (Best Fit)</option>
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="customerName">Your Name (optional)</label>
        <input type="text" id="customerName" placeholder="e.g. Rahul" />
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Upload &amp; Print Now</button>
    </form>

    <div class="card status-card" id="statusCard">
      <h3 style="margin: 0 0 8px;">Print Status</h3>
      <div id="statusList"></div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const dropzone = document.getElementById("dropzone");
    const fileListEl = document.getElementById("fileList");
    const errorBox = document.getElementById("errorBox");
    const submitBtn = document.getElementById("submitBtn");
    const statusCard = document.getElementById("statusCard");
    const statusList = document.getElementById("statusList");

    let selectedFiles = [];
    let colorMode = "color";
    let activeJobIds = [];
    let pollTimer = null;

    async function loadServerInfo() {
      try {
        const res = await fetch("/api/info");
        const data = await res.json();
        const mode = data.auto_print ? "Auto-Print ON" : "Approval Mode";
        document.getElementById("printerInfo").textContent =
          `Printer: ${data.active_printer || "Default"} • ${mode}`;
      } catch {
        document.getElementById("printerInfo").textContent = "Connected";
      }
    }
    loadServerInfo();

    document.querySelectorAll("[data-color]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-color]").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        colorMode = btn.dataset.color;
      });
    });

    document.getElementById("decCopies").onclick = () => {
      const el = document.getElementById("copies");
      el.value = Math.max(1, parseInt(el.value || "1", 10) - 1);
    };
    document.getElementById("incCopies").onclick = () => {
      const el = document.getElementById("copies");
      el.value = Math.min(99, parseInt(el.value || "1", 10) + 1);
    };

    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      addFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", () => addFiles(fileInput.files));

    function addFiles(files) {
      for (const f of files) selectedFiles.push(f);
      renderFiles();
    }

    function renderFiles() {
      fileListEl.innerHTML = "";
      selectedFiles.forEach((f, idx) => {
        const row = document.createElement("div");
        row.className = "file-item";
        row.innerHTML = `<span>${f.name} (${(f.size / 1024).toFixed(0)} KB)</span>`;
        const rm = document.createElement("button");
        rm.type = "button";
        rm.textContent = "Remove";
        rm.onclick = () => {
          selectedFiles.splice(idx, 1);
          renderFiles();
        };
        row.appendChild(rm);
        fileListEl.appendChild(row);
      });
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = msg ? "block" : "none";
    }

    document.getElementById("printForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      showError("");
      if (!selectedFiles.length) {
        showError("Please select at least one image or PDF file.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Uploading & Sending to Printer...";

      const form = new FormData();
      selectedFiles.forEach((f) => form.append("files", f));
      form.append("color_mode", colorMode);
      form.append("page_range", document.getElementById("pageRange").value || "all");
      form.append("copies", document.getElementById("copies").value || "1");
      form.append("orientation", document.getElementById("orientation").value);
      form.append("customer_name", document.getElementById("customerName").value || "Walk-in Customer");

      try {
        const res = await fetch("/api/upload", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "Upload failed");
        }
        if (data.errors && data.errors.length) {
          showError(data.errors.join(" | "));
        }
        selectedFiles = [];
        fileInput.value = "";
        renderFiles();

        activeJobIds = data.jobs.map((j) => j.id);
        statusCard.style.display = "block";
        renderStatuses(data.jobs);
        startPolling();
      } catch (err) {
        showError(err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Upload & Print Now";
      }
    });

    function renderStatuses(jobs) {
      statusList.innerHTML = jobs.map((j) => `
        <div class="job-status">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>${j.filename}</strong>
            <span class="badge ${j.status}">${j.status.replace("_", " ")}</span>
          </div>
          <div style="font-size:0.84rem; color:#94a3b8; margin-top:6px;">
            ${j.message} • ${j.color_mode.toUpperCase()} • Pages: ${j.page_range} • Copies: ${j.copies}
          </div>
        </div>
      `).join("");
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        if (!activeJobIds.length) return;
        const jobs = await Promise.all(
          activeJobIds.map((id) => fetch(`/api/jobs/${id}`).then((r) => (r.ok ? r.json() : null)))
        );
        const valid = jobs.filter(Boolean);
        if (valid.length) renderStatuses(valid);
        if (valid.every((j) => j.status === "printed" || j.status === "failed")) {
          clearInterval(pollTimer);
        }
      }, 1500);
    }
  </script>
</body>
</html>
