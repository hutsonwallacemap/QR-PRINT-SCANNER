<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Scan &amp; Print</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px 16px 32px;
    }
    .container { max-width: 480px; margin: 0 auto; }

    /* Header */
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.6rem; margin-bottom: 4px; }
    header p { color: var(--muted); font-size: 0.9rem; }
    .shop-badge {
      display: inline-block; margin-top: 8px; padding: 4px 14px;
      border-radius: 999px; font-size: 0.8rem; font-weight: 600;
      background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.35); color: #93c5fd;
    }

    /* Cards */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; margin-bottom: 16px;
    }

    /* Dropzone */
    .dropzone {
      border: 2px dashed #475569; border-radius: 14px; padding: 32px 16px;
      text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .dropzone.dragover { border-color: var(--primary); background: rgba(59,130,246,0.08); }
    .dropzone.has-files { border-color: var(--success); border-style: solid; background: rgba(34,197,94,0.06); }
    .dropzone input { display: none; }
    .dropzone .icon { font-size: 2.4rem; margin-bottom: 8px; }
    .dropzone .main-text { font-size: 1.05rem; font-weight: 600; }
    .dropzone .hint { color: var(--muted); font-size: 0.82rem; margin-top: 6px; }

    /* File list */
    .file-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .file-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #0f172a; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font-size: 0.88rem;
    }
    .file-item .fi-info { display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .file-item .fi-icon { font-size: 1.2rem; flex-shrink: 0; }
    .file-item .fi-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .fi-size { color: var(--muted); font-size: 0.78rem; flex-shrink: 0; }
    .file-item .fi-remove {
      background: none; border: none; color: var(--danger);
      font-weight: 700; cursor: pointer; font-size: 1.1rem; padding: 4px 8px;
    }

    /* Options */
    .section-title { font-size: 0.82rem; color: var(--muted); font-weight: 700; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .seg-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .seg-btn {
      padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: #0f172a; color: var(--muted); font-weight: 600;
      cursor: pointer; text-align: center; font-size: 0.95rem; transition: all 0.15s;
    }
    .seg-btn.active { background: rgba(59,130,246,0.2); border-color: var(--primary); color: #fff; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 0.95rem;
    }
    .copies-row { display: flex; align-items: center; gap: 8px; }
    .copies-row button {
      width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border);
      background: #0f172a; color: var(--text); font-size: 1.3rem; cursor: pointer;
    }
    .copies-row input { text-align: center; width: 60px; }

    /* Submit */
    .submit-btn {
      width: 100%; padding: 16px; border: none; border-radius: 14px;
      background: var(--primary); color: #fff; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s; margin-top: 4px;
    }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Status */
    .status-section { display: none; }
    .status-section.visible { display: block; }

    /* Success overlay */
    .success-overlay {
      display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.92);
      z-index: 100; justify-content: center; align-items: center; flex-direction: column;
    }
    .success-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .success-check {
      width: 100px; height: 100px; border-radius: 50%; background: rgba(34,197,94,0.15);
      border: 3px solid var(--success); display: flex; align-items: center; justify-content: center;
      font-size: 3rem; animation: popIn 0.4s ease;
    }
    @keyframes popIn { 0% { transform: scale(0.5); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .success-text { text-align: center; margin-top: 20px; }
    .success-text h2 { font-size: 1.5rem; color: var(--success); margin-bottom: 6px; }
    .success-text p { color: var(--muted); font-size: 0.95rem; }
    .success-close {
      margin-top: 24px; padding: 12px 32px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-weight: 600; cursor: pointer; font-size: 1rem;
    }

    /* Job status cards */
    .job-card {
      padding: 14px; border-radius: 12px; background: #0f172a;
      border: 1px solid var(--border); margin-top: 10px;
    }
    .job-top { display: flex; justify-content: space-between; align-items: center; }
    .job-file { font-weight: 600; font-size: 0.95rem; }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
    }
    .badge.queued, .badge.printing { background: rgba(245,158,11,0.2); color: #fcd34d; }
    .badge.printed { background: rgba(34,197,94,0.2); color: #86efac; }
    .badge.failed { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .badge.waiting_approval { background: rgba(59,130,246,0.2); color: #93c5fd; }
    .job-msg { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }

    .error-msg {
      color: #fca5a5; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35);
      padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; display: none; font-size: 0.88rem;
    }

    /* Collapsible advanced */
    .advanced-toggle {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      color: var(--muted); font-size: 0.82rem; font-weight: 600; margin-top: 14px; margin-bottom: 8px;
    }
    .advanced-toggle .arrow { transition: transform 0.2s; }
    .advanced-toggle.open .arrow { transform: rotate(90deg); }
    .advanced-body { display: none; }
    .advanced-body.open { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🖨️ Scan &amp; Print</h1>
      <p>Upload your photos or documents — prints automatically!</p>
      <div class="shop-badge" id="shopBadge">Connecting...</div>
    </header>

    <div class="error-msg" id="errorBox"></div>

    <form id="printForm">
      <div class="card">
        <div class="dropzone" id="dropzone">
          <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.bmp,.gif,.webp,.tiff,.tif,.pdf,.txt,.csv,.md" />
          <div class="icon" id="dropIcon">📸</div>
          <div class="main-text" id="dropText">Tap to choose photos or PDFs</div>
          <div class="hint">JPG, PNG, PDF, TXT • Multiple files OK • Max 50MB each</div>
        </div>
        <div class="file-list" id="fileList"></div>
      </div>

      <div class="card">
        <div class="section-title">Print Options</div>
        <div class="seg-group">
          <button type="button" class="seg-btn active" data-color="color">🎨 Color</button>
          <button type="button" class="seg-btn" data-color="bw">⬛ Black &amp; White</button>
        </div>

        <div class="row2">
          <div class="field">
            <label>Copies</label>
            <div class="copies-row">
              <button type="button" id="decCopies">−</button>
              <input type="number" id="copies" value="1" min="1" max="99" />
              <button type="button" id="incCopies">+</button>
            </div>
          </div>
          <div class="field">
            <label>Your Name</label>
            <input type="text" id="customerName" placeholder="Optional" />
          </div>
        </div>

        <div class="advanced-toggle" id="advToggle">
          <span class="arrow">▶</span> Advanced Options
        </div>
        <div class="advanced-body" id="advBody">
          <div class="row2">
            <div class="field">
              <label for="pageRange">Pages</label>
              <input type="text" id="pageRange" value="all" placeholder="all or 1-3, 5" />
            </div>
            <div class="field">
              <label for="orientation">Orientation</label>
              <select id="orientation">
                <option value="auto">Auto (Best Fit)</option>
                <option value="portrait">Portrait</option>
                <option value="landscape">Landscape</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn" disabled>
        Select files to print
      </button>
    </form>

    <div class="status-section" id="statusSection">
      <div class="card">
        <div class="section-title">Print Status</div>
        <div id="statusList"></div>
      </div>
    </div>
  </div>

  <!-- Success Overlay -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-check">✓</div>
    <div class="success-text">
      <h2>Sent to Printer!</h2>
      <p id="successDetail">Your files are printing now.</p>
    </div>
    <button class="success-close" id="successClose">Print More</button>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const dropzone = document.getElementById("dropzone");
    const fileListEl = document.getElementById("fileList");
    const errorBox = document.getElementById("errorBox");
    const submitBtn = document.getElementById("submitBtn");
    const statusSection = document.getElementById("statusSection");
    const statusList = document.getElementById("statusList");
    const successOverlay = document.getElementById("successOverlay");

    let selectedFiles = [];
    let colorMode = "color";
    let activeJobIds = [];
    let pollTimer = null;

    // Load server info
    fetch("/api/info").then(r => r.json()).then(data => {
      const name = data.shop_name || data.active_printer || "Ready";
      document.getElementById("shopBadge").textContent = `🖨️ ${name} • Auto-Print ON`;
    }).catch(() => {
      document.getElementById("shopBadge").textContent = "Connected";
    });

    // Color toggle
    document.querySelectorAll("[data-color]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("[data-color]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        colorMode = btn.dataset.color;
      });
    });

    // Copies
    document.getElementById("decCopies").onclick = () => {
      const el = document.getElementById("copies");
      el.value = Math.max(1, (parseInt(el.value) || 1) - 1);
    };
    document.getElementById("incCopies").onclick = () => {
      const el = document.getElementById("copies");
      el.value = Math.min(99, (parseInt(el.value) || 1) + 1);
    };

    // Advanced toggle
    document.getElementById("advToggle").addEventListener("click", () => {
      document.getElementById("advToggle").classList.toggle("open");
      document.getElementById("advBody").classList.toggle("open");
    });

    // File selection
    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("dragover", e => { e.preventDefault(); dropzone.classList.add("dragover"); });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop", e => { e.preventDefault(); dropzone.classList.remove("dragover"); addFiles(e.dataTransfer.files); });
    fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });

    function addFiles(files) {
      for (const f of files) {
        if (selectedFiles.length >= 10) break;
        if (f.size > 50 * 1024 * 1024) { showError(`${f.name} is too large (max 50MB).`); continue; }
        selectedFiles.push(f);
      }
      renderFiles();
    }

    function fileIcon(name) {
      const ext = name.split(".").pop().toLowerCase();
      if (["jpg","jpeg","png","bmp","gif","webp","tiff","tif"].includes(ext)) return "🖼️";
      if (ext === "pdf") return "📄";
      return "📝";
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + " KB";
      return (bytes/1024/1024).toFixed(1) + " MB";
    }

    function renderFiles() {
      fileListEl.innerHTML = "";
      selectedFiles.forEach((f, idx) => {
        const row = document.createElement("div");
        row.className = "file-item";
        row.innerHTML = `
          <div class="fi-info">
            <span class="fi-icon">${fileIcon(f.name)}</span>
            <span class="fi-name">${f.name}</span>
          </div>
          <span class="fi-size">${formatSize(f.size)}</span>
        `;
        const rm = document.createElement("button");
        rm.type = "button"; rm.className = "fi-remove"; rm.textContent = "✕";
        rm.onclick = () => { selectedFiles.splice(idx, 1); renderFiles(); };
        row.appendChild(rm);
        fileListEl.appendChild(row);
      });

      const hasFiles = selectedFiles.length > 0;
      dropzone.classList.toggle("has-files", hasFiles);
      document.getElementById("dropIcon").textContent = hasFiles ? "✅" : "📸";
      document.getElementById("dropText").textContent = hasFiles
        ? `${selectedFiles.length} file${selectedFiles.length > 1 ? "s" : ""} selected — tap to add more`
        : "Tap to choose photos or PDFs";
      submitBtn.disabled = !hasFiles;
      submitBtn.textContent = hasFiles
        ? `🖨️ Print ${selectedFiles.length} File${selectedFiles.length > 1 ? "s" : ""} Now`
        : "Select files to print";
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = msg ? "block" : "none";
    }

    // Submit
    document.getElementById("printForm").addEventListener("submit", async e => {
      e.preventDefault();
      showError("");
      if (!selectedFiles.length) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "⏳ Uploading & Sending to Printer...";

      const form = new FormData();
      selectedFiles.forEach(f => form.append("files", f));
      form.append("color_mode", colorMode);
      form.append("page_range", document.getElementById("pageRange").value || "all");
      form.append("copies", document.getElementById("copies").value || "1");
      form.append("orientation", document.getElementById("orientation").value);
      form.append("customer_name", document.getElementById("customerName").value || "Walk-in Customer");

      try {
        const res = await fetch("/api/upload", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Upload failed");
        if (data.errors && data.errors.length) showError(data.errors.join(" | "));

        const count = selectedFiles.length;
        selectedFiles = [];
        renderFiles();

        activeJobIds = data.jobs.map(j => j.id);
        statusSection.classList.add("visible");
        renderStatuses(data.jobs);
        startPolling();

        // Show success overlay
        document.getElementById("successDetail").textContent =
          `${count} file${count > 1 ? "s" : ""} sent to the printer. Check status below.`;
        successOverlay.classList.add("show");
      } catch (err) {
        showError(err.message);
      } finally {
        submitBtn.disabled = !selectedFiles.length;
        submitBtn.textContent = selectedFiles.length
          ? `🖨️ Print ${selectedFiles.length} Files Now`
          : "Select files to print";
      }
    });

    document.getElementById("successClose").addEventListener("click", () => {
      successOverlay.classList.remove("show");
    });

    function renderStatuses(jobs) {
      statusList.innerHTML = jobs.map(j => `
        <div class="job-card">
          <div class="job-top">
            <span class="job-file">${fileIcon(j.filename)} ${j.filename}</span>
            <span class="badge ${j.status}">${j.status.replace("_", " ")}</span>
          </div>
          <div class="job-msg">${j.message}</div>
        </div>
      `).join("");
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        if (!activeJobIds.length) return;
        const jobs = await Promise.all(
          activeJobIds.map(id => fetch(`/api/jobs/${id}`).then(r => r.ok ? r.json() : null))
        );
        const valid = jobs.filter(Boolean);
        if (valid.length) renderStatuses(valid);
        if (valid.every(j => j.status === "printed" || j.status === "failed")) clearInterval(pollTimer);
      }, 1500);
    }
  </script>
</body>
</html>
