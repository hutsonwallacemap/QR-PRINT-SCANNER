<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan to Print Poster</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 32px;
      display: flex;
      justify-content: center;
    }
    .poster {
      width: 100%;
      max-width: 620px;
      background: #fff;
      border: 3px solid #0f172a;
      border-radius: 24px;
      padding: 36px;
      text-align: center;
    }
    h1 { font-size: 2.3rem; margin: 0 0 8px; }
    .sub { font-size: 1.15rem; color: #475569; margin-bottom: 24px; }
    img { width: 320px; height: 320px; margin: 10px auto; display: block; }
    .url {
      display: inline-block;
      margin: 12px 0 24px;
      padding: 8px 16px;
      background: #f1f5f9;
      border-radius: 8px;
      font-family: monospace;
      font-size: 1.05rem;
    }
    .steps {
      text-align: left;
      background: #f8fafc;
      border-radius: 14px;
      padding: 18px 24px;
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .no-print { margin-top: 22px; }
    @media print {
      body { background: #fff; padding: 0; }
      .no-print { display: none; }
      .poster { border: 2px solid #0f172a; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="poster">
    <h1>📱 Scan &amp; Print Instantly</h1>
    <div class="sub">No app required • Photos, PDFs &amp; Documents</div>
    <img src="/api/qr" alt="Scan to Print QR Code" />
    <div class="url" id="posterUrl">Loading URL...</div>
    <div class="steps">
      <strong>How it works:</strong><br />
      1. Open your phone camera (works on 4G/5G mobile data or Wi-Fi)<br />
      2. Scan the QR code<br />
      3. Upload your images/PDFs, pick Color/B&amp;W &amp; pages, and tap <strong>Print Now</strong>
    </div>
    <div class="no-print">
      <button onclick="window.print()" style="padding:12px 24px; font-size:1rem; font-weight:700; cursor:pointer;">
        🖨️ Print This Poster
      </button>
    </div>
  </div>
  <script>
    fetch("/api/info").then((r) => r.json()).then((d) => {
      document.getElementById("posterUrl").textContent = d.qr_url;
    });
  </script>
</body>
</html>
