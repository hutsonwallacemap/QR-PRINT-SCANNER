<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan to Print</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc; color: #0f172a; margin: 0; padding: 32px;
      display: flex; justify-content: center;
    }
    .poster {
      width: 100%; max-width: 620px; background: #fff;
      border: 3px solid #0f172a; border-radius: 24px; padding: 40px; text-align: center;
    }
    .shop-name { font-size: 1rem; color: #64748b; margin-bottom: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    h1 { font-size: 2.4rem; margin: 0 0 8px; }
    .sub { font-size: 1.15rem; color: #475569; margin-bottom: 28px; }
    img { width: 320px; height: 320px; margin: 10px auto; display: block; border-radius: 12px; }
    .url {
      display: inline-block; margin: 14px 0 28px; padding: 10px 20px;
      background: #f1f5f9; border-radius: 10px; font-family: monospace; font-size: 1.05rem;
    }
    .steps {
      text-align: left; background: #f8fafc; border-radius: 14px;
      padding: 20px 28px; font-size: 1.08rem; line-height: 1.8;
    }
    .steps strong { font-size: 1.1rem; }
    .step-num {
      display: inline-block; width: 28px; height: 28px; line-height: 28px;
      text-align: center; border-radius: 50%; background: #0f172a; color: #fff;
      font-weight: 700; font-size: 0.85rem; margin-right: 8px;
    }
    .no-print { margin-top: 24px; }
    .print-btn {
      padding: 14px 32px; font-size: 1.05rem; font-weight: 700; cursor: pointer;
      border: 2px solid #0f172a; border-radius: 12px; background: #fff;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .no-print { display: none; }
      .poster { border: 2px solid #0f172a; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="poster">
    <img id="shopLogo" src="" alt="Shop Logo" style="display:none; width:72px; height:72px; object-fit:contain; margin:0 auto 10px;" />
    <div class="shop-name" id="shopNameDisplay"></div>
    <h1>📱 Scan &amp; Print Instantly</h1>
    <div class="sub">No app required • Photos, PDFs, Word &amp; Documents</div>
    <img src="/api/qr" alt="Scan to Print QR Code" />
    <div class="url" id="posterUrl">Loading URL...</div>
    <div id="shopPhoneDisplay" style="font-size:0.95rem; color:#475569; margin:-14px 0 18px; font-weight:600;"></div>
    <div class="steps">
      <strong>How it works:</strong><br /><br />
      <span class="step-num">1</span> Open your phone camera<br />
      <span class="step-num">2</span> Scan the QR code above<br />
      <span class="step-num">3</span> Upload photos or PDFs, choose Color or B&amp;W, and tap <strong>Print Now</strong><br /><br />
      <em style="color:#64748b; font-size:0.92rem;">Works on 4G/5G mobile data or Wi-Fi — no app download needed!</em>
    </div>
    <div class="no-print">
      <button onclick="window.print()" class="print-btn">🖨️ Print This Poster</button>
    </div>
  </div>
  <script>
    fetch("/api/info").then(r => r.json()).then(d => {
      document.getElementById("posterUrl").textContent = d.qr_url;
      if (d.shop_name) {
        document.getElementById("shopNameDisplay").textContent = d.shop_name;
      }
      if (d.shop_phone) {
        document.getElementById("shopPhoneDisplay").textContent = "📞 " + d.shop_phone;
      }
      if (d.has_logo) {
        const lg = document.getElementById("shopLogo");
        lg.src = "/api/logo?t=" + Date.now();
        lg.style.display = "block";
      }
    });
  </script>
</body>
</html>
